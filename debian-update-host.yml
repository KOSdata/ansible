---
###########################################################################
# Pre-checks
###########################################################################

- name: Read /etc/os-release
  ansible.builtin.shell: |
    . /etc/os-release
    echo "${ID}:${VERSION_ID}"
  register: os_release
  changed_when: false

- name: Validate supported Debian version
  ansible.builtin.assert:
    that:
      - os_release.stdout is match('^debian:(11|12|13)$')
    fail_msg: "Unsupported OS/version for this playbook: {{ os_release.stdout }}"
    success_msg: "Supported OS detected: {{ os_release.stdout }}"

- name: Get hostname before update
  ansible.builtin.command: hostname -f
  register: fqdn_before
  changed_when: false
  failed_when: false

###########################################################################
# Apt preflight and package list
###########################################################################

- name: Update apt cache
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 1800
    lock_timeout: "{{ apt_lock_timeout }}"

- name: Simulate apt dist-upgrade to capture package changes
  ansible.builtin.shell: |
    export DEBIAN_FRONTEND=noninteractive
    apt-get -s dist-upgrade | awk '
      /^Inst / {
        pkg=$2
        old=""
        new=""
        if (match($0, /\[([^]]+)\]/, a)) {
          old=a[1]
        }
        if (match($0, /\(([^ ]+)/, b)) {
          new=b[1]
        }
        if (old != "" && new != "") {
          print pkg " " old " -> " new
        } else {
          print pkg
        }
      }
    '
  register: packages_to_upgrade
  changed_when: false
  failed_when: false

- name: Show packages that will be upgraded
  ansible.builtin.debug:
    msg:
      host: "{{ inventory_hostname }}"
      fqdn: "{{ fqdn_before.stdout | default('unknown') }}"
      packages_to_upgrade: "{{ packages_to_upgrade.stdout_lines | default([]) }}"

###########################################################################
# Ensure lsof is available
###########################################################################

- name: Check whether lsof is installed
  ansible.builtin.command: command -v lsof
  register: lsof_check
  changed_when: false
  failed_when: false

- name: Install lsof when missing
  ansible.builtin.apt:
    name: lsof
    state: present
    lock_timeout: "{{ apt_lock_timeout }}"
  when: lsof_check.rc != 0

###########################################################################
# APT dist-upgrade
###########################################################################

- name: Run apt dist-upgrade
  ansible.builtin.apt:
    upgrade: dist
    autoremove: true
    autoclean: true
    lock_timeout: "{{ apt_lock_timeout }}"
  register: apt_upgrade

###########################################################################
# Reboot-required check
###########################################################################

- name: Check whether reboot is required in /var/run
  ansible.builtin.stat:
    path: /var/run/reboot-required
  register: reboot_required_varrun

- name: Check whether reboot is required in /run
  ansible.builtin.stat:
    path: /run/reboot-required
  register: reboot_required_run

- name: Set reboot_required fact
  ansible.builtin.set_fact:
    reboot_required: "{{ reboot_required_varrun.stat.exists or reboot_required_run.stat.exists }}"

- name: Read reboot-required package list if present
  ansible.builtin.shell: |
    if [ -f /var/run/reboot-required.pkgs ]; then
      cat /var/run/reboot-required.pkgs
    elif [ -f /run/reboot-required.pkgs ]; then
      cat /run/reboot-required.pkgs
    fi
  register: reboot_required_pkgs
  changed_when: false
  failed_when: false
  when: reboot_required | bool

###########################################################################
# Direct reboot when Debian says reboot is required
###########################################################################

- name: Reboot when reboot-required file is present
  ansible.builtin.reboot:
    msg: "Reboot initiated by AWX after Debian dist-upgrade because reboot-required file exists"
    reboot_timeout: "{{ reboot_timeout }}"
    connect_timeout: 30
    pre_reboot_delay: 5
    post_reboot_delay: 20
    test_command: "hostname -f"
  when: reboot_required | bool

- name: Get hostname after reboot-required reboot
  ansible.builtin.command: hostname -f
  register: fqdn_after_reboot_required
  changed_when: false
  failed_when: false
  when: reboot_required | bool

###########################################################################
# Needrestart-like logic using lsof
# Only runs when no full reboot is already required
###########################################################################

- name: Find processes using deleted files with lsof
  ansible.builtin.shell: |
    lsof -nP +L1 2>/dev/null | awk 'NR > 1 {print $2}' | sort -u
  register: affected_pids_raw
  changed_when: false
  failed_when: false
  when: not reboot_required | bool

- name: Set affected PIDs fact
  ansible.builtin.set_fact:
    affected_pids: "{{ affected_pids_raw.stdout_lines | default([]) }}"
  when: not reboot_required | bool

- name: Map affected PIDs to systemd services
  ansible.builtin.shell: |
    for pid in {{ affected_pids | default([]) | join(' ') }}; do
      [ -r "/proc/$pid/cgroup" ] || continue

      awk -F/ '
        {
          for (i=1; i<=NF; i++) {
            if ($i ~ /\.service$/) {
              print $i
            }
          }
        }
      ' "/proc/$pid/cgroup"
    done | sort -u
  register: affected_services_raw
  changed_when: false
  failed_when: false
  when:
    - not reboot_required | bool
    - affected_pids | default([]) | length > 0

- name: Set affected services fact
  ansible.builtin.set_fact:
    affected_services: "{{ affected_services_raw.stdout_lines | default([]) }}"
  when: not reboot_required | bool

- name: Capture affected non-service processes
  ansible.builtin.shell: |
    for pid in {{ affected_pids | default([]) | join(' ') }}; do
      [ -r "/proc/$pid/cgroup" ] || continue
      [ -r "/proc/$pid/comm" ] || continue

      service="$(awk -F/ '
        {
          for (i=1; i<=NF; i++) {
            if ($i ~ /\.service$/) {
              print $i
            }
          }
        }
      ' "/proc/$pid/cgroup" | head -n1)"

      if [ -z "$service" ]; then
        comm="$(cat /proc/$pid/comm 2>/dev/null || true)"
        echo "$pid:$comm"
      fi
    done | sort -u
  register: affected_non_service_processes_raw
  changed_when: false
  failed_when: false
  when:
    - not reboot_required | bool
    - affected_pids | default([]) | length > 0

- name: Set affected non-service processes fact
  ansible.builtin.set_fact:
    affected_non_service_processes: "{{ affected_non_service_processes_raw.stdout_lines | default([]) }}"
  when: not reboot_required | bool

###########################################################################
# Decide restart vs reboot
###########################################################################

- name: Split restartable and skipped services
  ansible.builtin.set_fact:
    restartable_services: "{{ affected_services | default([]) | difference(service_restart_denylist) }}"
    skipped_services: "{{ affected_services | default([]) | intersect(service_restart_denylist) }}"
  when: not reboot_required | bool

- name: Determine whether skipped services require reboot
  ansible.builtin.set_fact:
    reboot_due_to_skipped_services: "{{ (skipped_services | default([]) | length) > 0 }}"
  when: not reboot_required | bool

- name: Show affected processes and services before action
  ansible.builtin.debug:
    msg:
      host: "{{ inventory_hostname }}"
      fqdn: "{{ fqdn_before.stdout | default('unknown') }}"
      reboot_required_file_present: "{{ reboot_required }}"
      affected_pids: "{{ affected_pids | default([]) }}"
      affected_services: "{{ affected_services | default([]) }}"
      restartable_services: "{{ restartable_services | default([]) }}"
      skipped_services: "{{ skipped_services | default([]) }}"
      affected_non_service_processes: "{{ affected_non_service_processes | default([]) }}"
      reboot_due_to_skipped_services: "{{ reboot_due_to_skipped_services | default(false) }}"
  when: not reboot_required | bool

###########################################################################
# Reboot when skipped/critical services are affected
###########################################################################

- name: Reboot when skipped/critical services require restart
  ansible.builtin.reboot:
    msg: "Reboot initiated by AWX because critical/skipped service requires restart after Debian update"
    reboot_timeout: "{{ reboot_timeout }}"
    connect_timeout: 30
    pre_reboot_delay: 5
    post_reboot_delay: 20
    test_command: "hostname -f"
  when:
    - not reboot_required | bool
    - reboot_due_to_skipped_services | default(false) | bool

- name: Get hostname after skipped-service reboot
  ansible.builtin.command: hostname -f
  register: fqdn_after_skipped_service_reboot
  changed_when: false
  failed_when: false
  when:
    - not reboot_required | bool
    - reboot_due_to_skipped_services | default(false) | bool

###########################################################################
# Restart normal affected services when no reboot is needed
###########################################################################

- name: Restart affected restartable services
  ansible.builtin.systemd:
    name: "{{ item }}"
    state: restarted
  loop: "{{ restartable_services | default([]) }}"
  register: restarted_services_result
  failed_when: false
  when:
    - not reboot_required | bool
    - not reboot_due_to_skipped_services | default(false) | bool
    - restartable_services | default([]) | length > 0

- name: Reload systemd daemon after service restarts
  ansible.builtin.systemd:
    daemon_reload: true
  when:
    - not reboot_required | bool
    - not reboot_due_to_skipped_services | default(false) | bool

###########################################################################
# Post-check after service restarts
###########################################################################

- name: Re-scan affected processes after service restarts
  ansible.builtin.shell: |
    lsof -nP +L1 2>/dev/null | awk 'NR > 1 {print $2}' | sort -u
  register: remaining_affected_pids_raw
  changed_when: false
  failed_when: false
  when:
    - not reboot_required | bool
    - not reboot_due_to_skipped_services | default(false) | bool

- name: Set remaining affected PIDs fact
  ansible.builtin.set_fact:
    remaining_affected_pids: "{{ remaining_affected_pids_raw.stdout_lines | default([]) }}"
  when:
    - not reboot_required | bool
    - not reboot_due_to_skipped_services | default(false) | bool

- name: Map remaining affected PIDs to services
  ansible.builtin.shell: |
    for pid in {{ remaining_affected_pids | default([]) | join(' ') }}; do
      [ -r "/proc/$pid/cgroup" ] || continue

      awk -F/ '
        {
          for (i=1; i<=NF; i++) {
            if ($i ~ /\.service$/) {
              print $i
            }
          }
        }
      ' "/proc/$pid/cgroup"
    done | sort -u
  register: remaining_affected_services_raw
  changed_when: false
  failed_when: false
  when:
    - not reboot_required | bool
    - not reboot_due_to_skipped_services | default(false) | bool
    - remaining_affected_pids | default([]) | length > 0

- name: Set remaining affected services fact
  ansible.builtin.set_fact:
    remaining_affected_services: "{{ remaining_affected_services_raw.stdout_lines | default([]) }}"
  when:
    - not reboot_required | bool
    - not reboot_due_to_skipped_services | default(false) | bool

###########################################################################
# Final summary
###########################################################################

- name: Final summary
  ansible.builtin.debug:
    msg:
      host: "{{ inventory_hostname }}"
      fqdn_before: "{{ fqdn_before.stdout | default('unknown') }}"
      fqdn_after_reboot_required: "{{ fqdn_after_reboot_required.stdout | default('not rebooted by reboot-required') }}"
      fqdn_after_skipped_service_reboot: "{{ fqdn_after_skipped_service_reboot.stdout | default('not rebooted by skipped service') }}"
      os_release: "{{ os_release.stdout | default('unknown') }}"
      packages_planned_for_upgrade: "{{ packages_to_upgrade.stdout_lines | default([]) }}"
      apt_changed: "{{ apt_upgrade.changed | default(false) }}"
      reboot_required_file_present: "{{ reboot_required }}"
      reboot_required_packages: "{{ reboot_required_pkgs.stdout_lines | default([]) }}"
      affected_pids_before_action: "{{ affected_pids | default([]) }}"
      affected_services_before_action: "{{ affected_services | default([]) }}"
      affected_non_service_processes_before_action: "{{ affected_non_service_processes | default([]) }}"
      restartable_services: "{{ restartable_services | default([]) }}"
      skipped_services: "{{ skipped_services | default([]) }}"
      reboot_due_to_skipped_services: "{{ reboot_due_to_skipped_services | default(false) }}"
      services_restarted: >-
        {{
          restartable_services | default([])
          if (
            not reboot_required | default(false) | bool
            and not reboot_due_to_skipped_services | default(false) | bool
          )
          else []
        }}
      remaining_affected_pids_after_restart: "{{ remaining_affected_pids | default([]) }}"
      remaining_affected_services_after_restart: "{{ remaining_affected_services | default([]) }}"
